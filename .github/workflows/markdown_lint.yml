name: Linting

on: [pull_request]

jobs:
  markdown-coding-standards:
    name: Markdown coding standards
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Coding standards
        run: |
          docker run --rm --volume "$PWD:/md" itkdev/markdownlint **/*.md
